<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Products × Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
{% if not unconfigured %}<script src="https://accounts.google.com/gsi/client" async defer></script>{% endif %}
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f5;color:#17201c;
  font:14px/1.5 "Spline Sans",system-ui,sans-serif}
main{background:#fff;border:1px solid #dde2dd;border-top:3px solid #17201c;padding:32px 36px;
  width:min(380px,92vw)}
h1{font-size:19px;font-weight:600;margin:0 0 6px}
p{color:#5c6862;margin:0 0 20px}
.error{color:#b4690e;background:#f7ecda;padding:8px 10px;border-radius:4px;margin-top:16px}
</style>
</head>
<body>
<main>
  <h1>Products × Accounts</h1>
  {% if unconfigured %}
    <p class="error">Sign-in is not configured (SESSION_SECRET is missing), so this app is refusing to open.</p>
  {% else %}
    <p>ChartMogul products joined to Salesforce. Sign in with your @{{ domain }} Google account.</p>
    <div id="g_id_onload" data-client_id="{{ client_id }}" data-callback="onGoogleCredential"
         data-hd="{{ domain }}" data-auto_prompt="false" data-ux_mode="popup"></div>
    <div class="g_id_signin" data-type="standard" data-theme="outline" data-size="large"
         data-text="signin_with" data-shape="rectangular" data-width="300"></div>
    <p id="login-error" class="error" hidden></p>
  {% endif %}
</main>
<script>
  const NEXT = {{ next|tojson }};
  async function onGoogleCredential(resp) {
    const err = document.getElementById('login-error');
    err.hidden = true;
    const r = await fetch('/auth/google', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Requested-With': 'fetch'},
      body: JSON.stringify({credential: resp.credential}),
    });
    if (r.ok) { location.href = NEXT; return; }
    const body = await r.json().catch(() => ({}));
    err.textContent = body.detail || 'Sign-in failed.';
    err.hidden = false;
  }
</script>
</body>
</html>

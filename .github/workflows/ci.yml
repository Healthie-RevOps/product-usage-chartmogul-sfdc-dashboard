# Smoke tests on every PR and every push to main. Railway's "Wait for CI" setting holds
# deploys of main until this passes (see README "Deploy on Railway").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Offline: temp SQLite DB, no Salesforce/ChartMogul/Metabase credentials needed
      - run: python smoke_test.py
      # Catch JavaScript syntax errors (a broken script silently disables a page)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: for f in app/static/*.js; do node --check "$f"; done
